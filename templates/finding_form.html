{% extends "base.html" %}
{% block content %}
<h2>Submit Finding</h2>
<form method="post">
  <label>Target
    <select name="target_id" required>
      <option value="">Select target</option>
      {% for target in targets %}
      <option value="{{ target.id }}">{{ target.name }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Title <input name="title" required placeholder="SQLi in login endpoint" /></label>
  <label>Severity
    <select name="severity">
      <option>Low</option><option>Medium</option><option>High</option><option>Critical</option>
    </select>
  </label>
  <label>Status
    <select name="status">
      <option>Submitted</option><option>Triaged</option><option>Resolved</option>
    </select>
  </label>
  <label>Notes <textarea name="notes" rows="4"></textarea></label>
  <button type="submit">Submit Finding</button>
</form>
{% endblock %}
